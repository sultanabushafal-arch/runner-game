<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <div id="sky"></div>

    <div id="road">
        <div class="lane-line line-left"></div>
        <div class="lane-line line-right"></div>

        <div id="obstacles"></div>
        <div id="coins"></div>
    </div>

    <div id="player">🏃</div>
    <div id="chaser">👤</div>

    <div id="score">🪙 0</div>
    <div id="stage">المرحلة 1</div>

    <div id="controls">
        <button id="left">⬅️</button>
        <button id="jump">⬆️</button>
        <button id="right">➡️</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
